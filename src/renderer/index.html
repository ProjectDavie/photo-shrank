<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self' 'unsafe-inline' data: file:;
      img-src 'self' data: file:;
      media-src 'self' file:;
      style-src 'self' 'unsafe-inline';
      script-src 'self';
    "
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Photo Shrank
  </title>

  <link
    rel="stylesheet"
    href="../../styles.css"
  >
</head>

<body>

  <div id="app-container">

    <div id="sidebar">
      <div id="sidebar-header">
        <button id="open">
          Add Folder
        </button>
      </div>
      <div id="folders-list"></div>
    </div>

    <div id="main-content">

      <div id="controls">
        <span id="folder-path">
          No folder selected
        </span>
      </div>

      <div id="gallery"></div>

    </div>

  </div>

  <div id="modal">

    <span class="close">
      &times;
    </span>

    <div class="modal-content">
      <div class="modal-media">
        <img id="modal-img">
        <video
          id="modal-video"
          controls
        ></video>
      </div>
      <div
        class="info-box"
        id="info-box"
      ></div>
    </div>

  </div>

  <script
    type="module"
    src="./app.js"
  ></script>

</body>
</html>
