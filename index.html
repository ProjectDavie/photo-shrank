<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Photo Shrank Gallery</title>
  <style>
    body { font-family:sans-serif; margin:0; padding:0; background:#f5f5f5; }
    #controls { padding:15px; background:#fff; display:flex; align-items:center; gap:15px; }
    #folder-path { font-weight:bold; }
    button { padding:5px 10px; font-size:14px; cursor:pointer; }

    #gallery { display:flex; flex-wrap:wrap; gap:15px; padding:15px; justify-content:flex-start; }

    .photo-container {
      width:200px;
      height:150px;
      border:1px solid #ddd;
      box-shadow:2px 2px 8px rgba(0,0,0,0.2);
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      cursor:pointer;
      position:relative;
      border-radius:5px;
      background:#fff;
    }

    .photo-container img,
    .photo-container video {
      width:100%;
      height:100%;
      object-fit:contain;
    }

    #modal {
      display:none;
      position:fixed;
      top:0; left:0;
      width:100vw;
      height:100vh;
      background:rgba(0,0,0,0.8);
      justify-content:center;
      align-items:center;
      z-index:1000;
      flex-direction:column;
    }

    #modal img, #modal video { max-width:90%; max-height:90%; }

    #modal .close {
      position:absolute;
      top:20px;
      right:30px;
      font-size:30px;
      color:#fff;
      cursor:pointer;
      user-select:none;
    }
  </style>
</head>
<body>

<div id="controls">
  <button id="open">Open Folder</button>
  <span id="folder-path">No folder selected</span>
</div>

<div id="gallery"></div>

<div id="modal">
  <span class="close">&times;</span>
  <img id="modal-img">
  <video id="modal-video" controls></video>
</div>

<script>
const button = document.getElementById("open");
const folderPathSpan = document.getElementById("folder-path");
const gallery = document.getElementById("gallery");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modal-img");
const modalVideo = document.getElementById("modal-video");
const closeBtn = modal.querySelector(".close");

let currentIndex = 0;
let files = [];

button.onclick = async () => {
  const folder = await window.api.openFolder();
  if (!folder) return;

  folderPathSpan.textContent = `Selected: ${folder}`;
  files = await window.api.scanFolder(folder);
  renderGallery(files);
};

function renderGallery(files) {
  gallery.innerHTML = "";
  files.forEach((file, index) => {
    const container = document.createElement("div");
    container.className = "photo-container";

    const ext = file.path.split(".").pop().toLowerCase();
    if (["mp4","mov","mkv"].includes(ext)) {
      const video = document.createElement("video");
      video.src = file.path;
      container.appendChild(video);
    } else {
      const img = document.createElement("img");
      img.src = file.path;
      container.appendChild(img);
    }

    container.onclick = () => openModal(index);
    gallery.appendChild(container);
  });
}

function openModal(index) {
  currentIndex = index;
  const file = files[index];
  const ext = file.path.split(".").pop().toLowerCase();

  if (["mp4","mov","mkv"].includes(ext)) {
    modalImg.style.display = "none";
    modalVideo.src = file.path;
    modalVideo.style.display = "block";
  } else {
    modalVideo.style.display = "none";
    modalImg.src = file.path;
    modalImg.style.display = "block";
  }

  modal.style.display = "flex";
}

closeBtn.onclick = () => {
  modal.style.display = "none";
  modalVideo.pause();
}

document.addEventListener("keydown", (e) => {
  if(modal.style.display !== "flex") return;
  if(e.key === "ArrowRight") nextPhoto();
  if(e.key === "ArrowLeft") prevPhoto();
  if(e.key === "Escape") closeBtn.onclick();
});

function nextPhoto() { currentIndex = (currentIndex + 1) % files.length; openModal(currentIndex); }
function prevPhoto() { currentIndex = (currentIndex - 1 + files.length) % files.length; openModal(currentIndex); }
</script>

</body>
</html>
